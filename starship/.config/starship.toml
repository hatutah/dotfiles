# Loosely follows oh-my-zsh's robbyrussell theme:  ➜  dir git:(branch) ✗
add_newline = false
format = "$character$directory$git_branch$git_status"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[❮](bold green)"   # shown while in vi command mode

[directory]
style = "bold cyan"
truncation_length = 1
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
format = '[git:\(](bold blue)[$branch](bold red)[\)](bold blue) '

# Built-in status: cheaper than shelling out to `git status` on every prompt.
# Prints nothing when the tree is clean.
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
modified = "✗"
staged = "+"
untracked = "?"
deleted = "-"
renamed = "»"
conflicted = "="
stashed = ""
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
