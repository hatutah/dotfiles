# Mimics oh-my-zsh's robbyrussell theme:  ➜  dir git:(branch) ✗
add_newline = false
format = "$character$directory$git_branch${custom.git_dirty}"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold cyan"
truncation_length = 1
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
format = '[git:\(](bold blue)[$branch](bold red)[\)](bold blue) '

# Single ✗ when the tree has any change, like robbyrussell's dirty marker
[custom.git_dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
symbol = "✗"
style = "bold yellow"
format = "[$symbol]($style) "
