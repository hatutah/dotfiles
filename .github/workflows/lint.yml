name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools lint.sh needs
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh stow shellcheck tmux vim
      - run: ./lint.sh
